# LiteLLM Logical Roles Mapping
# Strategy: use GPT-OSS models on Groq (free tier)
# gpt-oss-120b for quality-critical roles, gpt-oss-20b for ultra-low latency

scorer:
  # GPT-OSS 120B — free tier, strong reasoning for batch scoring
  model: "groq/openai/gpt-oss-120b"
  temperature: 0.0
  max_tokens: 1024

context_writer:
  # GPT-OSS 120B — free tier, handles tools via function calling
  model: "groq/openai/gpt-oss-120b"
  temperature: 0.2
  max_tokens: 2048

composer:
  # GPT-OSS 120B — quality matters for the final spoken script
  model: "groq/openai/gpt-oss-120b"
  temperature: 0.7
  max_tokens: 4096

qa:
  # GPT-OSS 20B — ultra-low latency for interactive barge-in
  model: "groq/openai/gpt-oss-20b"
  temperature: 0.4
  max_tokens: 1024

trend_scout:
  # GPT-OSS 120B + DuckDuckGo tools
  model: "groq/openai/gpt-oss-120b"
  temperature: 0.1
  max_tokens: 2048