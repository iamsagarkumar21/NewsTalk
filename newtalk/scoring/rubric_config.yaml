# Category weights for importance rubric (tunable without code changes).
category_weights:
  policy: 1.0
  state: 0.98      # State-level domestic news (protests, exams, recruitment, bandhs)
  economy: 0.95
  markets: 0.92    # Stocks, Nifty/Sensex, mutual funds, IPOs, FII/DII flows
  tech: 0.9
  science: 0.9
  geopolitics: 0.95
  health: 0.85
  sports: 0.75
  entertainment: 0.6
  general: 0.7

# Signal weights — v2 rebalanced for tier-weighted corroboration + India relevance
signal_weights:
  tier_corroboration: 0.20
  recency: 0.15
  entity_scope: 0.12
  category: 0.10
  historical_continuity: 0.08
  india_relevance: 0.35

# LLM judgment blends with rule base (0=all rules, 1=all LLM)
llm_blend_weight: 0.35

rubric_version: "v2.1"

# India relevance strategy: "keyword" (v1) or "llm" (future extensible)
india_strategy: keyword

# Category base boost for India relevance (inherent domain importance)
india_relevance_category_boost:
  state: 0.3        # Highest — state-level directly affects citizens
  policy: 0.2
  economy: 0.25
  markets: 0.25     # Indian markets (Nifty/Sensex/FII) are inherently domestic
  geopolitics: 0.15
  health: 0.1
  sports: 0.1       # Cricket/IPL dominate Indian sports consumption

